name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # While the repository is private the action cannot read file contents and fails
          # hacsjson/integration_manifest with "Got None" (see hacs/integration#5497). Both
          # files are valid (hassfest checks the manifest). Remove this line when going public.
          ignore: hacsjson integration_manifest
